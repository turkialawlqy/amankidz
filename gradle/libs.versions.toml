[versions]
# نسخ الأدوات (مبنية على إعداد NewPipe، أكتوبر 2026)
agp = "9.5.0"  # آخر نسخة يدعمها Android Studio الحالي
kotlin = "2.4.10"
desugar = "2.1.5"
# يُفضّل تثبيت NewPipeExtractor على commit (JitPack أحياناً يحذف الإصدارات القديمة)
newpipe-extractor = "65cabc2ba5216ee871ace4a9963c08bdbf5d5dc0"
nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
exoplayer = "2.19.1"
okhttp = "5.5.0"
supabase = "3.8.0"
ktor = "3.5.1"
coroutines = "1.11.0"
serialization = "1.11.0"
activity = "1.13.0"
core = "1.19.0"
compose = "1.9.0"
material3 = "1.3.2"
coil = "3.5.0"
webkit = "1.15.0"
rxjava = "3.1.12"
rxandroid = "3.0.2"
lifecycle = "2.8.7"

[libraries]
android-desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe-extractor" }
newpipe-nanojson = { module = "com.github.TeamNewPipe:nanojson", version.ref = "nanojson" }
exoplayer-core = { module = "com.google.android.exoplayer:exoplayer-core", version.ref = "exoplayer" }
exoplayer-dash = { module = "com.google.android.exoplayer:exoplayer-dash", version.ref = "exoplayer" }
exoplayer-hls = { module = "com.google.android.exoplayer:exoplayer-hls", version.ref = "exoplayer" }
exoplayer-ui = { module = "com.google.android.exoplayer:exoplayer-ui", version.ref = "exoplayer" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
rxandroid = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
