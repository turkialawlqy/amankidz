<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>أمان كيدز TV</title>
    <!-- WebOS TV specific meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      @font-face {
        font-family: 'Tajawal';
        src: url('./fonts/tajawal_regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajawal';
        src: url('./fonts/tajawal_medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajawal';
        src: url('./fonts/tajawal_bold.ttf') format('truetype');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajawal';
        src: url('./fonts/tajawal_extrabold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      html {
        font-size: clamp(16px, 1.0vw, 19px) !important;
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        -webkit-text-size-adjust: 100%;
        background-color: #0A101D !important;
        color: #ffffff;
      }
      @media (min-width: 3840px) {
        html {
          font-size: clamp(26px, 0.9vw, 32px) !important;
        }
      }
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: none !important;
        caret-color: transparent !important;
      }
      /* إخفاء شريط التمرير نهائياً لمظهر تلفزيوني أصيل */
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        outline: none;
      }
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>
  <body class="bg-[#0E131F] text-white overflow-hidden select-none m-0 p-0 font-tajawal antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
